<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1級電気工事施工管理技士 一次 過去問（iPhone版）</title>
  <style>
    body { font-family: -apple-system, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 16px; line-height: 1.5; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 12px 0; }
    button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; background: #fff; }
    button.primary { border-color: #333; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .muted { color:#666; font-size: 12px; }
    .ok { color:#0a7; font-weight:600; }
    .ng { color:#c33; font-weight:600; }
    label.choice { display:block; padding:10px; border:1px solid #ddd; border-radius:10px; margin:8px 0; }
    input[type="radio"]{ margin-right:8px; }
    select, input[type="number"]{ padding:8px; border-radius:10px; border:1px solid #ddd; }
    .small { font-size: 12px; }
  </style>

  <!-- PDF.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.worker.min.js";
</script>
</head>
<body>
  <h1>一次 過去問トレーナー（iPhone Safari）</h1>
  <div class="muted">初回だけPDF取り込み → 以降は端末保存で演習できます（ローカル保存）。</div>

  <div class="card">
    <h2 style="font-size:16px;margin:0 0 8px;">① R7 PDFを取り込む</h2>
    <div class="row">
      <div>
        <div class="small">午前問題PDF</div>
        <input id="pdfA" type="file" accept="application/pdf" />
      </div>
      <div>
        <div class="small">午後問題PDF</div>
        <input id="pdfB" type="file" accept="application/pdf" />
      </div>
      <div>
        <div class="small">解答PDF</div>
        <input id="pdfK" type="file" accept="application/pdf" />
      </div>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="primary" id="btnImport">📥 取り込み</button>
      <button id="btnClear">🗑 データ初期化</button>
      <span id="importStatus" class="muted"></span>
    </div>
    <div class="muted" style="margin-top:8px;">
      うまくいかない問題が出たら、そのNoとスクショを送ってくれたらパーサを調整できます。
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:16px;margin:0 0 8px;">② 出題設定</h2>
    <div class="row">
      <label>午前/午後:
        <select id="selSession">
          <option value="both">両方</option>
          <option value="A">午前のみ</option>
          <option value="B">午後のみ</option>
        </select>
      </label>
      <label>モード:
        <select id="selMode">
          <option value="all">全問ランダム</option>
          <option value="wrong">間違いだけ</option>
          <option value="unseen">未回答だけ</option>
        </select>
      </label>
      <label>出題数:
        <input id="numLimit" type="number" min="5" max="80" value="20" />
      </label>
      <button class="primary" id="btnStart">▶ 開始</button>
    </div>
    <div class="muted" id="statsLine" style="margin-top:8px;"></div>
  </div>

  <div class="card" id="quizCard" style="display:none;">
    <div class="muted" id="qMeta"></div>
    <h2 style="font-size:16px;margin:8px 0;">問題</h2>
    <div id="qText"></div>

    <h3 style="font-size:14px;margin:12px 0 6px;">選択肢</h3>
    <div id="choices"></div>

    <div class="row" style="margin-top:10px;">
      <button class="primary" id="btnAnswer">✅ 解答する</button>
      <button id="btnSkip">⏭ スキップ</button>
      <button id="btnNext" style="display:none;">➡ 次へ</button>
    </div>

    <div id="result" style="margin-top:10px;"></div>
  </div>

<script>
  // ---------- Local storage keys ----------
  const KEY_Q = "pastq_r7_questions_v1";
  const KEY_S = "pastq_r7_stats_v1";

  // ---------- Helpers ----------
  const cidRe = /\(cid:\d+\)/g;
  const noRe = /〔No．\s*(\d+)\s*〕/g;
  const choiceRe = /^\s*([1-5])．\s*(.+)$/;

  function clean(s){
    return (s || "")
      .replace(cidRe, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function loadJSON(key, fallback){
    try { return JSON.parse(localStorage.getItem(key) || "") ?? fallback; }
    catch { return fallback; }
  }
  function saveJSON(key, obj){
    localStorage.setItem(key, JSON.stringify(obj));
  }

  function getStats(){
    return loadJSON(KEY_S, {});
  }
  function mark(qid, ok){
    const stats = getStats();
    const it = stats[qid] || { seen:0, correct:0, wrong:0, last:null };
    it.seen++;
    if(ok) it.correct++; else it.wrong++;
    it.last = new Date().toISOString();
    stats[qid] = it;
    saveJSON(KEY_S, stats);
  }

  // ---------- PDF text extraction ----------
  async function pdfToText(file){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let out = "";
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const strings = content.items.map(it => it.str);
      out += strings.join(" ") + "\n";
    }
    return out;
  }

  function parseAnswerKey(text){
    // 想定形式: 「問題No. 1 2 3 ...」 / 「正答肢 3 2 1 ...」
    const lines = text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    const ans = {};
    for(let i=0; i<lines.length-1; i++){
      if(lines[i].startsWith("問題No.") && lines[i+1].startsWith("正答肢")){
        const nos = (lines[i].match(/\d+/g) || []).map(n=>parseInt(n,10));
        const as = (lines[i+1].match(/\d+/g) || []).map(n=>parseInt(n,10));
        for(let k=0; k<Math.min(nos.length, as.length); k++){
          ans[nos[k]] = as[k]; // 1..5
        }
      }
    }
    return ans;
  }

  function splitByNo(text){
    // JSで No 区切りのブロック配列を作る
    const parts = [];
    let m, lastIndex = 0, lastNo = null;
    while((m = noRe.exec(text)) !== null){
      const no = parseInt(m[1],10);
      if(lastNo !== null){
        parts.push({ no: lastNo, body: text.slice(lastIndex, m.index) });
      }
      lastNo = no;
      lastIndex = m.index + m[0].length;
    }
    if(lastNo !== null){
      parts.push({ no: lastNo, body: text.slice(lastIndex) });
    }
    return parts;
  }

  function parseQuestions(text){
    const blocks = splitByNo(text);
    const qs = [];
    for(const b of blocks){
      const lines = b.body.split("\n").map(clean).filter(Boolean);

      // find first choice line
      let start = -1;
      for(let i=0; i<lines.length; i++){
        if(choiceRe.test(lines[i])) { start = i; break; }
      }
      if(start < 0) continue;

      const qLines = lines.slice(0, start);
      const cLines = lines.slice(start);

      const question = qLines.join(" ").trim();
      const choices = ["","","","",""];
      let cur = null;

      for(const ln of cLines){
        const m = ln.match(choiceRe);
        if(m){
          const idx = parseInt(m[1],10) - 1;
          choices[idx] = (m[2] || "").trim();
          cur = idx;
        }else{
          if(cur !== null && choices[cur]){
            choices[cur] = (choices[cur] + " " + ln).trim();
          }
        }
      }

      qs.push({ no: b.no, question, choices });
    }
    return qs;
  }

  // ---------- Import ----------
  const statusEl = document.getElementById("importStatus");
  document.getElementById("btnImport").addEventListener("click", async () => {
    const fa = document.getElementById("pdfA").files[0];
    const fb = document.getElementById("pdfB").files[0];
    const fk = document.getElementById("pdfK").files[0];
    if(!fa || !fb || !fk){
      statusEl.textContent = "PDF3つ（午前/午後/解答）を選んでください。";
      return;
    }
    statusEl.textContent = "PDFを読み取り中…（少し待ってね）";

    try{
      const [ta, tb, tk] = await Promise.all([pdfToText(fa), pdfToText(fb), pdfToText(fk)]);
      const answers = parseAnswerKey(tk);

      const qa = parseQuestions(ta).map(x => ({
        id: `R7-A-${x.no}`, session:"A", no:x.no, question:x.question,
        choices:x.choices, answer: (answers[x.no] || "").toString()
      }));
      const qb = parseQuestions(tb).map(x => ({
        id: `R7-B-${x.no}`, session:"B", no:x.no, question:x.question,
        choices:x.choices, answer: (answers[x.no] || "").toString()
      }));

      const all = [...qa, ...qb].filter(q => q.question && q.choices.some(c=>c && c.trim()));
      saveJSON(KEY_Q, all);

      statusEl.textContent = `✅ 取り込み完了: ${all.length}問`;
      refreshStatsLine();
    }catch(e){
      console.error(e);
      statusEl.textContent = "❌ 取り込み失敗。PDFの種類違い or 形式崩れの可能性。";
    }
  });

  document.getElementById("btnClear").addEventListener("click", ()=>{
    localStorage.removeItem(KEY_Q);
    localStorage.removeItem(KEY_S);
    statusEl.textContent = "初期化しました。";
    refreshStatsLine();
  });

  // ---------- Quiz ----------
  let pool = [];
  let idx = 0;
  let current = null;

  function getQuestions(){
    return loadJSON(KEY_Q, []);
  }

  function buildPool(questions, mode, session, limit){
    let q = questions.slice();
    if(session !== "both"){
      q = q.filter(x => x.session === session);
    }
    const stats = getStats();

    if(mode === "wrong"){
      q = q.filter(x => (stats[x.id]?.wrong || 0) > 0);
    }else if(mode === "unseen"){
      q = q.filter(x => !(x.id in stats));
    }
    // shuffle
    for(let i=q.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [q[i], q[j]] = [q[j], q[i]];
    }
    return q.slice(0, limit);
  }

  function renderQuestion(){
    current = pool[idx];
    if(!current){
      document.getElementById("quizCard").style.display = "block";
      document.getElementById("qMeta").textContent = "終了！ おつかれさま。";
      document.getElementById("qText").innerHTML = "";
      document.getElementById("choices").innerHTML = "";
      document.getElementById("result").innerHTML = "";
      document.getElementById("btnAnswer").style.display = "none";
      document.getElementById("btnSkip").style.display = "none";
      document.getElementById("btnNext").style.display = "none";
      refreshStatsLine();
      return;
    }

    document.getElementById("quizCard").style.display = "block";
    document.getElementById("btnAnswer").style.display = "inline-block";
    document.getElementById("btnSkip").style.display = "inline-block";
    document.getElementById("btnNext").style.display = "none";
    document.getElementById("result").innerHTML = "";

    document.getElementById("qMeta").textContent =
      `問題 ${idx+1}/${pool.length} ｜ ${current.session==="A"?"午前":"午後"} ｜ No.${current.no} ｜ ID:${current.id}`;
    document.getElementById("qText").textContent = current.question;

    const ch = document.getElementById("choices");
    ch.innerHTML = "";
    const valid = current.choices
      .map((t,i)=>({n:(i+1).toString(), t:(t||"").trim()}))
      .filter(x=>x.t);

    valid.forEach(x=>{
      const lab = document.createElement("label");
      lab.className = "choice";
      lab.innerHTML = `<input type="radio" name="pick" value="${x.n}"> ${x.n}. ${escapeHtml(x.t)}`;
      ch.appendChild(lab);
    });
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  document.getElementById("btnStart").addEventListener("click", ()=>{
    const questions = getQuestions();
    if(!questions.length){
      alert("先にPDFを取り込んでください（①）。");
      return;
    }
    const session = document.getElementById("selSession").value;
    const mode = document.getElementById("selMode").value;
    const limit = Math.max(5, Math.min(80, parseInt(document.getElementById("numLimit").value || "20", 10)));

    pool = buildPool(questions, mode, session, limit);
    idx = 0;

    if(!pool.length){
      alert("その条件だと出題できる問題がありません（モード/午前午後を変更してね）。");
      return;
    }
    renderQuestion();
  });

  document.getElementById("btnSkip").addEventListener("click", ()=>{
    idx++;
    renderQuestion();
  });

  document.getElementById("btnAnswer").addEventListener("click", ()=>{
    const pick = document.querySelector('input[name="pick"]:checked')?.value;
    if(!pick){
      alert("選択肢を選んでください。");
      return;
    }
    const correct = (current.answer || "").trim();
    const ok = (pick === correct);
    mark(current.id, ok);

    const res = document.getElementById("result");
    res.innerHTML = ok
      ? `<div class="ok">正解 🎯（正答肢: ${correct}）</div>`
      : `<div class="ng">不正解…（あなた: ${pick} / 正答肢: ${correct}）</div>`;

    document.getElementById("btnNext").style.display = "inline-block";
  });

  document.getElementById("btnNext").addEventListener("click", ()=>{
    idx++;
    renderQuestion();
  });

  function refreshStatsLine(){
    const qs = getQuestions();
    const st = getStats();
    let seen=0, ok=0, ng=0;
    for(const k in st){
      seen += st[k].seen || 0;
      ok += st[k].correct || 0;
      ng += st[k].wrong || 0;
    }
    const line = document.getElementById("statsLine");
    line.textContent = `保存済み問題: ${qs.length}問 ｜ 解いた数: ${seen} ｜ 正解: ${ok} ｜ 不正解: ${ng}`;
  }

  refreshStatsLine();
</script>
</body>
</html>
